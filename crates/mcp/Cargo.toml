[package]
name = "pasta-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pasta-mcp"
path = "src/main.rs"

[dependencies]
pasta-common = { path = "../common" }
kb-core = { path = "../kb-core" }
kb-storage = { path = "../kb-storage" }
rmcp = { version = "1.7", features = ["server", "transport-io"] }
tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
schemars = "0.8"
chrono = { workspace = true }
