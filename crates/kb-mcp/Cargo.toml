[package]
name = "kb-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kb-mcp"
path = "src/main.rs"

[dependencies]
kb-core = { path = "../kb-core" }
kb-storage = { path = "../kb-storage" }
rmcp = { version = "1.7", features = ["server", "transport-io"] }
tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
schemars = "0.8"

[lints]
workspace = true
